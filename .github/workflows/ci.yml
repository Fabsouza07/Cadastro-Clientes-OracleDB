name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 26
          cache: maven

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Para esta aplicação local, configure suas variáveis de ambiente de banco no próprio ambiente
      # de desenvolvimento. Exemplo:
      #   DB_URL=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
      #   DB_USUARIO=cadastro_clientes
      #   DB_SENHA=<senha_segura>
      
      - name: Build with Maven
        run: mvn -B -DskipTests=false clean verify

      - name: Run tests
        run: mvn -B test

      - name: Install gitleaks
        run: |
          curl -sL https://github.com/zricethezav/gitleaks/releases/latest/download/gitleaks-linux-amd64 -o gitleaks
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Scan repository for secrets
        run: |
          gitleaks detect --source . --exit-code 1
